name: build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  engine:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Clone OGSR engine
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/OGSR/OGSR-Engine.git C:\e
          if errorlevel 1 exit /b 1

      - name: Update third-party components
        shell: cmd
        working-directory: C:\e
        run: |
          call Update_Components.cmd < nul
          echo components done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply VR patches
        shell: cmd
        run: |
          python tools\apply_patches.py C:\e
          if errorlevel 1 exit /b 1

      - name: MSBuild Release x64
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          msbuild C:\e\Engine.sln /m /p:Configuration=Release /p:Platform=x64 /v:minimal /nologo /flp:logfile=C:\e\build.log;verbosity=normal
          if errorlevel 1 (type C:\e\build.log | findstr /i "error" & exit /b 1)

      - name: Collect output
        shell: cmd
        run: |
          dir /s /b C:\e\bin_x64
          copy /y C:\e\ogsr_engine\xrVR\openvr\lib\openvr_api.dll C:\e\bin_x64\openvr_api.dll
          dir /s /b C:\e\bin_x64\xrEngine.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            C:\e\build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xrEngine-exe
          path: |
            C:\e\bin_x64\**
          if-no-files-found: warn
